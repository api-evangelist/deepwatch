aid: deepwatch
name: Deepwatch
description: 'Deepwatch is a US managed security services provider delivering AI-native
  managed detection and response (MDR) governed by human security experts. Its Guardian
  platform and Security Center console aggregate and correlate telemetry from a customer''s
  existing SIEM, EDR, cloud, identity, network and vulnerability tooling — Splunk,
  CrowdStrike Falcon Next-Gen SIEM, Microsoft Sentinel, Google SecOps, SentinelOne,
  Microsoft Defender, Carbon Black, Okta, Entra ID, Tenable, Qualys, Wiz, Palo Alto
  and Fortinet among them — rather than requiring a rip-and-replace. Services span
  MDR, managed endpoint detection and response, continuous threat exposure management,
  vulnerability management, managed firewall, dark web monitoring and active response,
  with the NEXA agentic-AI ecosystem layered across detection, investigation and response.
  Deepwatch publishes contractual service-level commitments (99.9% platform uptime,
  10-minute critical MTTD), a SafeBase trust center and an llms.txt, but exposes no
  public API documentation: the customer-facing surface is an authenticated GraphQL
  API behind the Security Center console.'
