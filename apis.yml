apis:
- name: Deepwatch Security Center API
  description: 'The authenticated GraphQL API behind the Deepwatch Security Center
    console (devportal.deepwatch.com). The endpoint is an AWS AppSync GraphQL service
    at devportalapi.deepwatch.com/graphql/ with a realtime subscription channel advertised
    over wss://*.deepwatch.com/graphql/realtime. Deepwatch publishes no public schema,
    reference documentation or OpenAPI: anonymous introspection is refused by a WAF
    rule (HTTP 403 WAFForbiddenException) and access is gated behind Okta-brokered
    single sign-on. Recorded here as an evidenced, auth-gated contract surface, not
    a public API.'
